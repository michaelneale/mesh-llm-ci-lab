name: Save the compiler cache
description: >
  Report compiler cache use, drop the cached objects this job did not use,
  then save the cache in place of the one setup-build restored.
  Only main saves, so pull requests read a cache they cannot change.

runs:
  using: composite
  steps:
    - name: Report disk and compiler cache use
      shell: bash
      run: |
        df -h .
        sccache --show-stats
        sccache --stop-server || true
        # Keep only what this job used, so the saved cache does not grow.
        find "$SCCACHE_DIR" -type f ! -newer "$RUNNER_TEMP/build-cache-marker" -delete
        du -sh "$SCCACHE_DIR"
    # GitHub keeps 10 GB of caches per repository and, once over, evicts the
    # least recently read, which can be one saved minutes ago. So the cache
    # this one replaces is deleted first, not left beside it.
    - name: Delete the cache this one replaces
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$BUILD_CACHE_PREFIX" --json id --jq '.[].id' |
          tr -d '\r' | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
    - name: Save the compiler cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ env.BUILD_CACHE_KEY }}
