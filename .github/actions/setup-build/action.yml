name: Set up build tools
description: >
  Everything a job needs before it can run cargo or just in this repository:
  Rust, just, sccache (the repository Cargo config requires it), and the
  platform linker. The compiler cache is shared through the Actions cache.

inputs:
  components:
    description: Extra rustup components, comma separated.
    required: false
    default: ""
  node:
    description: Also install Node and pnpm, for jobs that build the console.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

    - name: Use short Windows build paths
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-windows-short-paths

    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      with:
        components: ${{ inputs.components }}

    - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just

    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Share the compiler cache through the Actions cache
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"

    - name: Install Linux linkers
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q mold lld ninja-build

    - name: Install macOS linker
      if: runner.os == 'macOS'
      shell: bash
      run: brew install lld ninja

    - name: Set up the MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Install Windows linker tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: rustup component add llvm-tools-preview

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: inputs.node == 'true'
      with:
        package_json_file: mesh/crates/mesh-llm-ui/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version-file: .nvmrc
