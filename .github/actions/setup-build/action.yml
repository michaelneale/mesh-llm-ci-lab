name: Set up build tools
description: >
  Everything a job needs before it can run cargo or just in this repository:
  Rust, just, sccache (the repository Cargo config requires it), and the
  platform linker. Restores the compiler cache for the job named by `cache`;
  the job saves it again on main with save-build-cache.

inputs:
  components:
    description: Extra rustup components, comma separated.
    required: false
    default: ""
  cache:
    description: Name of the compiler cache this job shares, usually the job name.
    required: true
  node:
    description: Also install Node and pnpm, for jobs that build the console.
    required: false
    default: "false"
  packages:
    description: Extra apt packages, space separated (Linux only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      # Removing these takes over a minute, so it runs behind the build.
      run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

    # Keep the compiler cache and temporary files under short Windows paths.
    - name: Use short Windows paths
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p /c/s /c/t
        printf '%s\n' 'SCCACHE_DIR=C:\s' 'TEMP=C:\t' 'TMP=C:\t' >> "$GITHUB_ENV"

    # One pinned compiler everywhere, so a new Rust release cannot turn CI red
    # on its own. Bump it in a pull request.
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      with:
        toolchain: 1.100.0
        components: ${{ inputs.components }}

    - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just

    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # sccache 0.17 and later expand Cargo's rustc argument file, which passes
      # the Windows command-line limit (mozilla/sccache#2787).
      with:
        version: ${{ runner.os == 'Windows' && 'v0.16.0' || '' }}

    # sccache keeps its cache in one directory, saved and restored as a single
    # Actions cache entry. Its per-object Actions backend is rate limited.
    - name: Configure the compiler cache
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
        LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
      run: |
        if [[ -z "${SCCACHE_DIR:-}" ]]; then
          echo "SCCACHE_DIR=$HOME/.cache/sccache-ci" >> "$GITHUB_ENV"
        fi
        {
          echo "SCCACHE_CACHE_SIZE=4G"
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
          echo "BUILD_CACHE_PREFIX=build-$RUNNER_OS-$RUNNER_ARCH-$CACHE-"
          echo "BUILD_CACHE_KEY=build-$RUNNER_OS-$RUNNER_ARCH-$CACHE-$LOCK_HASH-$GITHUB_SHA"
        } >> "$GITHUB_ENV"

    - name: Restore the compiler cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ env.BUILD_CACHE_KEY }}
        restore-keys: |
          ${{ env.BUILD_CACHE_PREFIX }}${{ hashFiles('Cargo.lock') }}-
          ${{ env.BUILD_CACHE_PREFIX }}

    - name: Install Linux linkers and packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update -q
        # shellcheck disable=SC2086 # a space-separated package list
        sudo apt-get install -y -q mold lld ninja-build $PACKAGES

    - name: Install macOS linker
      if: runner.os == 'macOS'
      shell: bash
      run: brew install lld ninja

    - name: Set up the MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Install Windows linker tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: rustup component add llvm-tools-preview

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: inputs.node == 'true'
      with:
        package_json_file: mesh/crates/mesh-llm-ui/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version-file: .nvmrc
