# Build the release archive for each platform on GitHub's runners, run the
# packaged binary once, and attach the archives to a GitHub release.
name: Release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, matching the workspace version (v0.80.0).
        required: true
        type: string
      publish:
        description: Create the GitHub release. Off builds and tests the archives only.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, recipe: release-build, device: MTL0 }
          - { name: Linux x86_64, runner: ubuntu-24.04, recipe: release-build, device: CPU }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, recipe: release-build-aarch64, device: CPU }
          - { name: Linux x86_64 Vulkan, runner: ubuntu-24.04, recipe: release-build-vulkan, flavor: vulkan, device: Vulkan0,
              packages: libvulkan-dev glslc spirv-headers mesa-vulkan-drivers vulkan-tools }
          - { name: Windows x86_64, runner: windows-2025, recipe: release-build, device: CPU, workdir: 'C:\w' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache: ${{ matrix.recipe }}-${{ matrix.flavor || 'default' }}
          node: "true"
          packages: ${{ matrix.packages }}
      - name: Link the checkout at a short path
        if: matrix.workdir
        shell: cmd
        run: mklink /J "${{ matrix.workdir }}" "%GITHUB_WORKSPACE%"
      - name: Build the release binaries
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: just ${{ matrix.recipe }}
      - name: Package the release archive
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: just release-bundle "$VERSION" dist "${{ matrix.flavor }}"
      - name: Restore the smoke model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/models
          key: smoke-model-${{ hashFiles('ci/model-artifacts/manifests/product-smoke.json') }}
          enableCrossOsArchive: true
      - name: Unpack the archive and complete a chat request with it
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: |
          archive="$(find dist -maxdepth 1 -type f -name "mesh-llm-$VERSION-*" ! -name '*.sha256')"
          mkdir -p "$RUNNER_TEMP/product"
          case "$archive" in
            *.zip) unzip -q "$archive" -d "$RUNNER_TEMP/product" ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/product" ;;
          esac
          binary="$(find "$RUNNER_TEMP/product" -type f \( -name mesh-llm -o -name mesh-llm.exe \) | head -n 1)"
          model="$(ci/simple/fetch-model.sh ci/model-artifacts/manifests/product-smoke.json smollm2-q8-inference "$RUNNER_TEMP/models")"
          ci/simple/smoke.sh "$binary" "$model" "${{ matrix.device }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-build-cache

  publish:
    name: Publish the GitHub release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release with every archive attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
