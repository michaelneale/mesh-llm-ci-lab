# Build the release archives for each platform on GitHub's runners, run the
# packaged binary once, and attach the archives to a GitHub release.
#
# Each platform produces the MeshLLM archive, the native runtime archive that
# MeshLLM downloads, the Skippy CLI archive and the Node SDK addon. The release
# also carries native-runtimes.json, which lists the native runtime archives.
#
# To release: `just release v1.2.3`. It starts this workflow, which sets that
# version in the source, builds and tests the archives, and then commits the
# version change to main, tags it and publishes. Pushing a v* tag whose source
# already carries the version does the same.
name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (v1.2.3).
        required: true
        type: string
      publish:
        description: Create the GitHub release. Off builds and tests the archives only.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # GitHub's limit for a job. A cold CUDA or ROCm build of llama.cpp takes two
    # to three hours, and over four with CUDA 13 on Windows.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, recipe: release-build, device: MTL0 }
          - { name: Linux x86_64, runner: ubuntu-24.04, recipe: release-build, device: CPU }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, recipe: release-build-aarch64, device: CPU }
          - { name: Linux x86_64 Vulkan, runner: ubuntu-24.04, recipe: release-build-vulkan, flavor: vulkan, device: CPU,
              packages: libvulkan-dev glslc spirv-headers mesa-vulkan-drivers vulkan-tools }
          - { name: Windows x86_64, runner: windows-2025, recipe: release-build, device: CPU }
          # GitHub's runners have no NVIDIA or AMD card, so the CUDA and ROCm
          # archives are built and packaged here but not started.
          - { name: Linux x86_64 CUDA 12, runner: ubuntu-24.04, recipe: release-build-cuda, flavor: cuda, cuda: 12-9,
              cuda_archs: "61;75;80;86;87;89;90" }
          - { name: Linux x86_64 CUDA 13, runner: ubuntu-24.04, recipe: release-build-cuda, flavor: cuda, cuda: 13-1 }
          - { name: Linux arm64 CUDA 12, runner: ubuntu-24.04-arm, recipe: release-build-aarch64-cuda, flavor: cuda, cuda: 12-9 }
          - { name: Linux arm64 CUDA 13, runner: ubuntu-24.04-arm, recipe: release-build-aarch64-cuda, flavor: cuda, cuda: 13-1 }
          - { name: Linux x86_64 ROCm, runner: ubuntu-24.04, recipe: release-build-rocm, flavor: rocm, rocm: "7.0" }
          - { name: Windows x86_64 Vulkan, runner: windows-2022, recipe: release-build-vulkan-windows, flavor: vulkan,
              windows_vulkan: 1.4.328.1 }
          # 12.8.0 is the toolkit today's Windows CUDA 12 archive is built with.
          - { name: Windows x86_64 CUDA 12, runner: windows-2022, recipe: 'release-build-cuda-windows "61;75;80;86;89;90"',
              flavor: cuda, windows_cuda: 12.8.0,
              cuda_packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]' }
          - { name: Windows x86_64 CUDA 13, runner: windows-2022, recipe: 'release-build-cuda-windows "75;80;86;89;90;100;103;120"',
              flavor: cuda, windows_cuda: 13.1.2,
              cuda_packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]' }
          - { name: Windows x86_64 ROCm, runner: windows-2022, recipe: release-build-rocm-windows, flavor: rocm,
              windows_rocm: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache: ${{ matrix.recipe }}-${{ matrix.flavor || 'default' }}
          node: "true"
          packages: ${{ matrix.packages }}
      - name: Set the version being released
        run: scripts/release-version.sh "$VERSION"
      - name: Install NVIDIA's CUDA toolkit
        if: matrix.cuda
        env:
          CUDA: ${{ matrix.cuda }}
        run: |
          # NVIDIA publishes one package repository per architecture.
          case "$(uname -m)" in
            x86_64) repo=x86_64 keyring_sha256=d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba ;;
            aarch64) repo=sbsa keyring_sha256=6ea7d2737648936820e85677177957a0f6521b840d98eb0bbae0a4f003fa7249 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/cuda-keyring.deb" \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/$repo/cuda-keyring_1.1-1_all.deb"
          echo "$keyring_sha256  $RUNNER_TEMP/cuda-keyring.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "cuda-toolkit-$CUDA"
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
          # Packaging names the archive after the toolkit's major version.
          echo "MESH_LLM_CUDA_TOOLKIT_MAJOR=${CUDA%%-*}" >> "$GITHUB_ENV"
          df -h /
      - name: Install AMD's ROCm toolkit
        if: matrix.rocm
        env:
          KEY: https://repo.radeon.com/rocm/rocm.gpg.key
          KEY_SHA256: 2de99e2354646a90d9903e2a669fc4e36b02c1bbff7075c481e12d7edab2c88b
          ROCM: ${{ matrix.rocm }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/rocm.key" "$KEY"
          echo "$KEY_SHA256  $RUNNER_TEMP/rocm.key" | sha256sum -c -
          sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg "$RUNNER_TEMP/rocm.key"
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/$ROCM noble main" |
            sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' |
            sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends hip-dev hipblas-dev rocblas-dev rocm-cmake rocm-device-libs
          echo /opt/rocm/bin >> "$GITHUB_PATH"
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          df -h /
      - name: Install NVIDIA's CUDA toolkit on Windows
        if: matrix.windows_cuda
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.windows_cuda }}
          method: network
          sub-packages: ${{ matrix.cuda_packages }}
      - name: Name the archive after the CUDA toolkit's major version
        if: matrix.windows_cuda
        env:
          CUDA: ${{ matrix.windows_cuda }}
        run: |
          nvcc --version
          echo "MESH_CUDA_VERSION=$CUDA" >> "$GITHUB_ENV"
          echo "MESH_LLM_CUDA_TOOLKIT_MAJOR=${CUDA%%.*}" >> "$GITHUB_ENV"
      - name: Install the Vulkan SDK on Windows
        if: matrix.windows_vulkan
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ matrix.windows_vulkan }}
          cache: false
          stripdown: true
      - name: Install AMD's HIP SDK on Windows
        if: matrix.windows_rocm
        shell: pwsh
        run: .\scripts\install-windows-sdk.ps1 -Backend rocm -RocmHipSdkFilename "${{ matrix.windows_rocm }}"
      # Packaging signs mesh-llm when the keys are configured, and checks the
      # signature. Without them the binary is published unsigned.
      - name: Prepare the release signing keys
        env:
          SIGNING_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE }}
          PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: |
          [[ -n "$SIGNING_KEY" && -n "$PUBLIC_KEY" ]] || { echo "No signing keys are configured."; exit 0; }
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing-key.json"
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/release-public-key.json"
          echo "MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE=$RUNNER_TEMP/release-signing-key.json" >> "$GITHUB_ENV"
          echo "MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE=$RUNNER_TEMP/release-public-key.json" >> "$GITHUB_ENV"
      # A CUDA or ROCm build of llama.cpp takes one to three hours. It is kept
      # for the next release that has the same llama.cpp, patches and toolkit:
      # build-llama.sh skips a build that is already there.
      - name: Restore the GPU build of llama.cpp
        if: matrix.cuda || matrix.rocm
        id: llama
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps/llama-build
          key: release-llama-${{ runner.arch }}-${{ matrix.flavor }}-${{ matrix.cuda || matrix.rocm }}-${{ matrix.cuda_archs }}-${{ hashFiles('skippy/llama_cpp/**', 'skippy/scripts/prepare-llama.sh', 'skippy/scripts/build-llama.sh', 'scripts/lib/**', 'just/release-build.just') }}
      - name: Build the release binaries
        env:
          # Empty leaves the choice to the recipe or, on arm64, to llama.cpp.
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.cuda_archs }}
          # A release job keeps no compiler cache, and sccache fails on nvcc
          # with llama.cpp's own GPU list ('Missing "cubin" file output').
          LLAMA_STAGE_USE_SCCACHE: "0"
          # Compiled into the binary so that it reports anonymous usage. A
          # build without the secret reports nothing.
          MESH_LLM_POSTHOG_KEY: ${{ secrets.MESH_LLM_POSTHOG_KEY }}
        run: |
          just ${{ matrix.recipe }}
          du -sh .deps/* || true
      # A cache saved by a tag's run can only be read by that tag.
      - name: Save the GPU build of llama.cpp
        if: steps.llama.outcome == 'success' && steps.llama.outputs.cache-hit != 'true' && github.ref_type == 'branch'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps/llama-build
          key: ${{ steps.llama.outputs.cache-primary-key }}
      - name: Package the release archives
        run: |
          runtimes=dist/native-runtimes
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The Windows build writes the native runtime beside the binaries.
            runtimes=target/release/native-runtimes
            MESH_LLM_NATIVE_RUNTIME_ROOT="$(cygpath -w "$PWD/$runtimes")"
            export MESH_LLM_NATIVE_RUNTIME_ROOT
          fi
          just release-bundle "$VERSION" dist "${{ matrix.flavor }}"
          # The Skippy CLI and the Node SDK addon are the same for every flavour
          # of a platform.
          if [[ -z "${{ matrix.flavor }}" ]]; then
            ci/simple/package-skippy-cli.sh "$VERSION" dist
            ci/simple/package-node-addon.sh "$VERSION" dist
            # The native SDK is released for macOS and Linux.
            [[ "$RUNNER_OS" == Windows ]] || ci/simple/package-native-sdk.sh dist
          fi
          # The native runtime archive was written by the build.
          find "$runtimes" -maxdepth 1 -type f -name 'meshllm-native-runtime-*.tar.gz*' -exec mv {} dist/ \;
          if [[ "$RUNNER_OS" == Windows ]]; then
            # unzip fails on an archive whose entries use backslash separators.
            for zip in dist/*.zip; do unzip -tq "$zip"; done
          fi
          ls -l dist
          test -s "$(echo dist/meshllm-native-runtime-*.tar.gz)"
      - name: Restore the smoke model
        if: matrix.device
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/models
          key: smoke-model-${{ hashFiles('ci/model-artifacts/manifests/product-smoke.json') }}
          enableCrossOsArchive: true
      - name: Unpack the archive and complete a chat request with it
        if: matrix.device
        run: |
          archive="$(find dist -maxdepth 1 -type f -name "mesh-llm-$VERSION-*" ! -name '*.sha256')"
          mkdir -p "$RUNNER_TEMP/product"
          case "$archive" in
            *.zip) unzip -q "$archive" -d "$RUNNER_TEMP/product" ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/product" ;;
          esac
          binary="$(find "$RUNNER_TEMP/product" -type f \( -name mesh-llm -o -name mesh-llm.exe \) | head -n 1)"
          model="$(ci/simple/fetch-model.sh ci/model-artifacts/manifests/product-smoke.json smollm2-q8-inference "$RUNNER_TEMP/models")"
          ci/simple/smoke.sh "$binary" "$model" "${{ matrix.device }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ strategy.job-index }}
          # The archives are already compressed.
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.crate
            dist/*.sha256
          if-no-files-found: error
      # Releases are rare and their compiler caches are large, so none is saved:
      # GitHub keeps 10 GB of caches per repository and CI needs that room.

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The checkout keeps its credentials: this job pushes the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-build
        with:
          cache: release-publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: List the native runtime archives in native-runtimes.json
        run: |
          scripts/generate-native-runtime-release-manifest.sh --tag "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --out dist/native-runtimes.json dist/meshllm-native-runtime-*.tar.gz
          (cd dist && sha256sum native-runtimes.json > native-runtimes.json.sha256)
      - name: Commit the version, tag it, and push both
        if: github.ref_type != 'tag'
        run: |
          scripts/release-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git diff --cached --quiet || git commit -q -m "$VERSION: prepare release source"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          # The branch may have moved while the archives were being built.
          git push origin "HEAD:$GITHUB_REF" || {
            git fetch origin "$GITHUB_REF"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GITHUB_REF"
          }
      - name: Create the release with every archive attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix, such as v1.2.3-rc.1, is a prerelease.
          prerelease=()
          [[ "$VERSION" != *-* ]] || prerelease=(--prerelease --latest=false)
          # The notes cover everything since the last stable release, so a
          # release candidate's notes do not start at the candidate before it.
          core="${VERSION%%-*}"
          base="$(git ls-remote --tags --refs origin 'v[0-9]*' | sed 's|.*refs/tags/||' | grep -v -- - |
            { cat; echo "$core"; } | sort -Vu | grep -B1 -x "$core" | grep -vx "$core" || true)"
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            ${base:+--notes-start-tag "$base"} "${prerelease[@]}"
      # Mesh-LLM/mesh-packaging builds the packages, container images and npm
      # release from a published stable release. Skipped without its token.
      - name: Tell mesh-packaging about a stable release
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          GH_TOKEN: ${{ secrets.MESH_AGENT_IMAGES_DISPATCH_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "No mesh-packaging token is configured; skipping."; exit 0; }
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$VERSION" --arg version "${VERSION#v}" \
            --arg sha "$(git rev-parse "$VERSION^{commit}")" \
            --arg manifest "$(sha256sum dist/native-runtimes.json | awk '{print $1}')" \
            --arg id "mesh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{event_type: "mesh-llm-release", client_payload: {repository: $repository, ref: $ref,
              version: $version, expected_mesh_sha: $sha, expected_manifest_sha256: $manifest,
              correlation_id: $id, dry_run: false, publish_images: true,
              publish_release_assets: true, publish_npm: true}}' |
            gh api --method POST repos/Mesh-LLM/mesh-packaging/dispatches --input -
